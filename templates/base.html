<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}آزمایشگاه مهر|سامانه تشخیص طبی{% endblock %}</title>
    <style>
        :root { --primary: #0f5ba7; --accent: #0ab7b8; --bg: #f4f8fc; --card: #ffffff; --text: #1f2d3d; --muted: #607d8b; --border: #dfeaf4; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Tahoma, sans-serif; background: var(--bg); color: var(--text); }
        a { color: var(--primary); text-decoration: none; }
        .topbar { background: linear-gradient(90deg, var(--primary), #0d7ec3); color: white; padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: bold; font-size: 1.2rem; }
        .nav { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        .nav a { color: white; opacity: 0.95; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 18px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 5px 18px rgba(15,91,167,0.06); }
        .hero { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 24px; align-items: center; }
        .hero-text { padding: 30px; }
        .hero-text h1 { font-size: 2.2rem; margin-top: 0; }
        .btn { display: inline-block; padding: 12px 18px; border-radius: 10px; background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn.secondary { background: #eaf6f7; color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 24px; }
        .service-card { padding: 20px; }
        .muted { color: var(--muted); }
        .stats { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 16px; margin-top: 24px; }
        .stat { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
        .stat h3 { margin-bottom: 4px; font-size: 1.8rem; }
        form { display: grid; gap: 12px; }
        input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        .two-col { display: grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: right; }
        th { background: #edf5ff; }
        .message { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; }
        .message.success { background: #eafaf3; color: #147d3b; }
        .message.error { background: #fff1f1; color: #a12828; }
        .page-title { font-size: 2rem; margin-bottom: 10px; }
        .inline-actions a, .inline-actions button { margin-left: 8px; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand">آزمایشگاه مهر</div>
        <nav class="nav">
            <a href="{% url 'home' %}">خانه</a>
            <a href="{% url 'services' %}">خدمات</a>
            {% if user.is_authenticated %}
                {% if user.is_staff %}
                    <a href="{% url 'admin_dashboard' %}">داشبورد مدیریت</a>
                {% else %}
                    <a href="{% url 'patient_dashboard' %}">داشبورد بیمار</a>
                {% endif %}
                <a href="{% url 'logout' %}">خروج</a>
            {% else %}
                <a href="{% url 'login' %}">ورود</a>
                <a href="{% url 'register' %}">ثبت‌نام</a>
            {% endif %}
        </nav>
    </div>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
