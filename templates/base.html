<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>سامانه آزمایشگاه</title><style>body{font-family:Tahoma;background:#f4f7fb;margin:0;color:#24324a}.nav{background:#123b63;color:white;padding:18px 8%;display:flex;justify-content:space-between}.container{max-width:1100px;margin:30px auto}.cards{display:flex;gap:16px}.card{background:white;padding:22px;border-radius:10px;flex:1;box-shadow:0 2px 8px #ccd}.btn{background:#117a8b;color:white;padding:10px 16px;border:0;border-radius:6px;text-decoration:none;display:inline-block}table{width:100%;background:white;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #eee;text-align:right}input,select,textarea{padding:10px;width:95%;margin:6px 0;border:1px solid #ccd;border-radius:5px}.msg{background:#dff5e8;padding:12px;border-radius:6px}</style></head><body><div class="nav"><b>سامانه مدیریت آزمایشگاه</b><a class="btn" href="/admin/">پنل مدیریت</a></div><main class="container">{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
