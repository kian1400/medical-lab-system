{% extends 'base.html' %}
{% block title %}پرداخت | آزمایشگاه مهر{% endblock %}
{% block content %}
<div class="card" style="max-width:600px; margin:40px auto; padding:30px;">
    <h2 class="page-title">پرداخت سفارش</h2>
    <div class="pay-box">
        <p><strong>کد رهگیری:</strong> {{ order.tracking_code }}</p>
        <p><strong>مبلغ قابل پرداخت:</strong> {{ order.total_price }} تومان</p>
        <p><strong>نوع سفارش:</strong> {{ order.get_order_type_display }}</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit">تأیید و پرداخت</button>
    </form>
</div>
{% endblock %}
