{% extends "base.html" %}{% block content %}<h1>ورود نتایج: {{ order.tracking_code }}</h1><form method="post">{% csrf_token %}{% for item in order.items.all %}<fieldset><legend>{{ item.test.name }} ({{ item.test.reference_range }})</legend><input name="value_{{ item.pk }}" value="{% if item.result %}{{ item.result.value }}{% endif %}" placeholder="نتیجه"><textarea name="comment_{{ item.pk }}" placeholder="توضیحات">{% if item.result %}{{ item.result.comment }}{% endif %}</textarea></fieldset>{% endfor %}<button class="btn">ثبت و ارسال برای تأیید</button></form>{% endblock %}
