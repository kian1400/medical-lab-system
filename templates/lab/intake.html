{% extends "base.html" %}{% block content %}<h1>پذیرش بیمار</h1><form method="post">{% csrf_token %}<label>کد ملی</label><input name="national_id" required><label>نام</label><input name="first_name" required><label>نام خانوادگی</label><input name="last_name" required><label>موبایل</label><input name="phone" required><label>جنسیت</label><select name="gender"><option value="M">مرد</option><option value="F">زن</option><option value="O">سایر</option></select><label>پزشک درخواست‌کننده</label><input name="physician"><h3>آزمایش‌ها</h3>{% for test in tests %}<label><input type="checkbox" name="tests" value="{{ test.pk }}"> {{ test.name }} ({{ test.code }})</label><br>{% endfor %}<br><button class="btn">ثبت پذیرش</button></form>{% endblock %}
